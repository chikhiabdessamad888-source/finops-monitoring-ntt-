name: Surveillance FinOps - Detection des ressources zombies
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  detection-zombies:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dependances
        run: pip install pandas numpy

      - name: Execution du script de surveillance
        run: python monitoring_zombies.py

      - name: Archivage du journal d'alertes
        uses: actions/upload-artifact@v4
        with:
          name: journal-finops
          path: journal_alertes_finops.log
